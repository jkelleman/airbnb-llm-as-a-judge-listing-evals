[project]
name = "listing-highlight-evals"
version = "0.2.0"
description = "Calibrated LLM-as-judge evaluation for AI-written listing highlights"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
